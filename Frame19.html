<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>豆浆油条</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #e9e9ec; }
    body { display: grid; place-items: center; padding: 0; font-family: Arial, "Microsoft YaHei", sans-serif; }
    .artboard {
      position: relative;
      width: min(375px, 100vw);
      aspect-ratio: 375 / 812;
      overflow: hidden;
      background: #f5f5f7;
      box-shadow: 0 18px 50px rgba(0,0,0,.18);
    }
    .screen { display: block; width: 100%; height: 100%; object-fit: fill; }
    .hit {
      position: absolute; z-index: 10; display: block;
      border: 0; background: transparent; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hit:focus-visible { outline: 3px solid #22c55e; outline-offset: 2px; }
    .back { left: 1.5%; top: 6.4%; width: 13%; height: 7%; }
    .reselect { left: 5%; top: 85.2%; width: 29%; height: 7.4%; border-radius: 18px; }
    .share { left: 36%; top: 85.2%; width: 59%; height: 7.4%; border-radius: 18px; }
    .number-fix {
      position: absolute; z-index: 6;
      left: 10.8%; top: 86.95%; width: 7.7%; aspect-ratio: 1;
      display: grid; place-items: center;
      border-radius: 50%; background: #ffe000;
      color: #08090c; font-size: clamp(14px, 4.6vw, 19px); font-weight: 800;
      line-height: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="artboard" aria-label="豆浆油条结果页">
    <img class="screen" src="images/Frame19.jpg" alt="豆浆油条结果">
    <span class="number-fix" aria-hidden="true">7</span>
    <a class="hit back" href="home.html" aria-label="返回首页"></a>
    <a class="hit reselect" href="Frame18.html" aria-label="再次重选"></a>
    <a class="hit share" href="ShareSoy.html" aria-label="分享豆浆油条"></a>
  </main>
</body>
</html>
