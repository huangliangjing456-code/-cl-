<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>分享豆浆油条</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #e9e9ec; }
    body { display: grid; place-items: center; font-family: Arial, "Microsoft YaHei", sans-serif; }
    .artboard { position: relative; width: min(375px,100vw); aspect-ratio: 375/812; overflow: hidden; background: #fff; box-shadow: 0 18px 50px rgba(0,0,0,.18); }
    .background { display: block; width: 100%; height: 100%; object-fit: fill; }
    .shade { position: absolute; inset: 0; background: rgba(0,0,0,.76); }
    .share-card { position: absolute; z-index: 3; left: 11.2%; top: 13.15%; width: 77.6%; height: 54.25%; overflow: hidden; border-radius: 28px; background: #fff; }
    .share-card img { position: absolute; left: -5.8%; top: -21.5%; width: 111.6%; height: 159.4%; max-width: none; }
    .close { position: absolute; z-index: 5; left: 44%; top: 69.15%; width: 12%; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: #fff; color: #3d3d3f; text-decoration: none; font-size: 0; }
    .close::before, .close::after { content: ""; position: absolute; width: 20px; height: 4px; border-radius: 2px; background: currentColor; }
    .close::before { transform: rotate(45deg); }
    .close::after { transform: rotate(-45deg); }
    .sheet { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; height: 20.5%; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 30px 22px 18px; background: #fff; border-radius: 22px 22px 0 0; }
    .share-option { display: grid; place-items: center; align-content: center; gap: 10px; border: 0; border-radius: 18px; background: #f5f5f7; color: #08090c; font: 650 17px/1.2 Arial, "Microsoft YaHei", sans-serif; cursor: pointer; }
    .icon { position: relative; display: block; width: 42px; height: 42px; }
    .wechat { border-radius: 12px; background: #08c96f; }
    .wechat::before, .wechat::after { content: ""; position: absolute; border: 2px solid #fff; border-radius: 50%; background: #fff; }
    .wechat::before { width: 21px; height: 16px; left: 7px; top: 9px; }
    .wechat::after { width: 18px; height: 14px; right: 5px; bottom: 7px; box-shadow: 0 0 0 2px #08c96f inset; }
    .save { border: 4px solid #111; border-radius: 7px; }
    .save::before { content: "↓"; position: absolute; right: -8px; bottom: -8px; display: grid; place-items: center; width: 23px; height: 23px; border-radius: 50%; background: #ffe000; color: #111; font: 800 20px/1 Arial, sans-serif; }
    .share-option:focus-visible, .close:focus-visible { outline: 3px solid #22c55e; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="artboard" aria-label="豆浆油条分享状态">
    <img class="background" src="%E5%90%83%E4%BA%86%E5%90%97/images/Frame19.jpg" alt="">
    <span class="shade" aria-hidden="true"></span>
    <section class="share-card" aria-label="豆浆油条分享卡片"><img src="%E5%90%83%E4%BA%86%E5%90%97/images/Frame19.jpg" alt="豆浆油条分享卡片"></section>
    <a class="close" href="Frame19.html" aria-label="关闭分享"></a>
    <section class="sheet" aria-label="分享方式">
      <button class="share-option" type="button"><span class="icon wechat" aria-hidden="true"></span><span>分享好友</span></button>
      <button class="share-option" type="button"><span class="icon save" aria-hidden="true"></span><span>保存本地</span></button>
    </section>
  </main>
</body>
</html>
