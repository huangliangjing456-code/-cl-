<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>分享</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #e9e9ec; }
    body { display: grid; place-items: center; padding: 0; font-family: Arial, "Microsoft YaHei", sans-serif; }
    .artboard {
      position: relative; width: min(375px,100vw); aspect-ratio: 375/812;
      overflow: hidden; background: #fff; box-shadow: 0 18px 50px rgba(0,0,0,.18);
    }
    .screen { display: block; width: 100%; height: 100%; object-fit: fill; }
    .barbecue-replacement {
      position: absolute; z-index: 6;
      left: 18.1%; top: 27.15%; width: 63.8%; height: 26%;
      object-fit: contain; background: transparent;
      pointer-events: none;
    }
    .modal-date-fix {
      position: absolute; z-index: 7;
      left: 32.55%; top: 58.08%; width: 2.8%; height: 2.55%;
      display: flex; align-items: center; justify-content: center;
      background: #fff; color: #08090c;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px; font-weight: 400; line-height: 1;
      pointer-events: none;
    }
    .background-date-fix {
      position: absolute; z-index: 2;
      left: 29.05%; top: 69.15%; width: 2.8%; height: 2.55%;
      display: flex; align-items: center; justify-content: center;
      background: #333; color: #08090c;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px; font-weight: 400; line-height: 1;
      pointer-events: none;
    }
    .hit { position: absolute; z-index: 10; display: block; background: transparent; }
    .close { left: 42%; top: 68.2%; width: 16%; height: 8.5%; border-radius: 50%; }
    .back { left: 0; top: 6%; width: 12%; height: 7%; }
    .hit:focus-visible { outline: 3px solid #22c55e; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="artboard" aria-label="分享状态">
    <img class="screen" src="images/ShareState.jpg" alt="分享好友或保存本地">
    <span class="background-date-fix" aria-hidden="true">1</span>
    <img class="barbecue-replacement" src="images/ShareBarbecue.jpg" alt="烧烤">
    <span class="modal-date-fix" aria-hidden="true">1</span>
    <a class="hit close" href="Frame17.html" aria-label="关闭分享"></a>
    <a class="hit back" href="Frame17.html" aria-label="返回结果页"></a>
  </main>
</body>
</html>
